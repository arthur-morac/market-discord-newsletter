name: Market & Crypto Discord Newsletter

on:
  schedule:
    # Clôture Nasdaq = 13:00 heure de San Francisco (16:00 ET) — Lundi, Mercredi, Vendredi
    # 20:15 UTC en été (PDT, UTC-7) et 21:15 UTC en hiver (PST, UTC-8)
    - cron: "15 20,21 * * 1,3,5"
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Check San Francisco local time (DST guard)
        id: time_check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SF_HOUR=$(TZ="America/Los_Angeles" date +%H)
          echo "Current San Francisco hour: $SF_HOUR"
          if [ "$SF_HOUR" = "13" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping run outside 13:xx America/Los_Angeles (DST offset)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.time_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate and send Discord newsletter
        if: steps.time_check.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/newsletter.py
