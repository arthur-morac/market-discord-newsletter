name: Market & Crypto Discord Newsletter

on:
  schedule:
    # Nasdaq closes at 13:00 PT (San Francisco).
    # Spread retries from 13:17 PT to 23:17 PT (Mon-Fri PT) across PDT (UTC-7) and PST (UTC-8).
    # Off-peak minutes (:17, :43) avoid top-of-hour GitHub Actions queue congestion.
    - cron: "17,43 20,21,22,23 * * 1-5"
    - cron: "17 0,2,4,6 * * 2-6"
  workflow_dispatch:
    inputs:
      force:
        description: "Force send even if already sent today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-discord-newsletter
  cancel-in-progress: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Check schedule window and idempotency
        id: check_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SF_DATE=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          SF_HOUR=$(TZ="America/Los_Angeles" date +%H | sed 's/^0//')
          SF_HOUR=${SF_HOUR:-0}
          SF_DOW=$(TZ="America/Los_Angeles" date +%u)
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          echo "San Francisco date: $SF_DATE"
          echo "San Francisco hour: $SF_HOUR"
          echo "San Francisco day of week (1=Mon..7=Sun): $SF_DOW"

          # 1. Handle manual triggers
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "Manual trigger with force=true: proceeding."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG_CHECK=$(git ls-remote --tags "$REPO_URL" "refs/tags/sent-$SF_DATE" 2>/dev/null || true)
            if echo "$TAG_CHECK" | grep -q "sent-$SF_DATE"; then
              echo "Newsletter for $SF_DATE already sent today! Skipping (use force=true to override)."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Manual trigger detected: proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Only run on weekdays in San Francisco time (Mon-Fri)
          if [ "$SF_DOW" -gt 5 ]; then
            echo "Skipping: weekend in San Francisco (day $SF_DOW)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Never run before Nasdaq close (13:00 PT)
          if [ "$SF_HOUR" -lt 13 ]; then
            echo "Skipping: market not closed yet (< 13:00 PT)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. Idempotency check via Git tag (prevents duplicates across all retries)
          TAG_CHECK=$(git ls-remote --tags "$REPO_URL" "refs/tags/sent-$SF_DATE" 2>/dev/null || true)
          if echo "$TAG_CHECK" | grep -q "sent-$SF_DATE"; then
            echo "Newsletter for $SF_DATE already sent today! Skipping to avoid duplicate."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Validation passed: sending newsletter for $SF_DATE."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.check_run.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Generate and send Discord newsletter
        if: steps.check_run.outputs.should_run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/newsletter.py

      - name: Record successful send via Git tag
        if: steps.check_run.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SF_DATE=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "sent-$SF_DATE"
          git push origin "sent-$SF_DATE" --force
          echo "Successfully tagged sent-$SF_DATE on origin"
